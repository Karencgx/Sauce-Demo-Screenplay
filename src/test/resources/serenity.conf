serenity {
    take.screenshots = AFTER_EACH_STEP
    # false = un navegador nuevo por escenario (evita que el carrito de una prueba contamine la siguiente)
    use.unique.browser = false
    test.root = co.com.udea.calidad.saucedemo
    console.colors = true
    report {
        accessibility = false
    }
    requirement {
        types = "epic, feature"
    }
}

#headless.mode = true

webdriver {
  driver = chrome
  autodownload = true
  wait.for.timeout = 15000
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
  }
}

chrome.switches = """--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;
                   --disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;
                   --incognito;--disable-infobars,--disable-gpu;--remote-allow-origins=*;
                   --disable-features=PasswordLeakDetection;--disable-save-password-bubble"""

pages {
    saucedemoUrl = "https://www.saucedemo.com/"
}